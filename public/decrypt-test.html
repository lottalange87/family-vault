<html>
<head><title>Decrypt Test</title></head>
<body>
<h1>Video Decryption Test</h1>
<p>Testing crypto operations...</p>
<div id="status">Initializing...</div>
<pre id="log" style="background: #f0f0f0; padding: 10px; margin-top: 20px; overflow: auto; max-height: 400px;"></pre>

<script>
const videoId = '5770a81a-d1f1-4ffa-8ccb-1aab451d310a';
const log = document.getElementById('log');
const status = document.getElementById('status');

function logMsg(msg) {
  log.textContent += msg + '\n';
  console.log(msg);
}

// Base64 to Uint8Array
function base64ToUint8Array(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

// Generate chunk IV (same as upload)
function generateChunkIV(chunkIndex) {
  const iv = new Uint8Array(12);
  const view = new DataView(iv.buffer);
  view.setBigUint64(0, BigInt(chunkIndex), false);
  view.setUint32(8, 0, false);
  return iv;
}

// Get master key from session storage
function getMasterKey() {
  const vaultData = sessionStorage.getItem('vault');
  if (!vaultData) return null;
  const vault = JSON.parse(vaultData);
  return vault.masterKey;
}

async function testDecryption() {
  try {
    logMsg('1. Checking vault state...');
    const vaultData = sessionStorage.getItem('vault');
    logMsg(`   Vault data: ${vaultData ? 'found' : 'NOT FOUND'}`);
    
    if (!vaultData) {
      logMsg('   ERROR: Vault not unlocked! Please login first.');
      status.textContent = 'Vault locked - please login';
      return;
    }
    
    const vault = JSON.parse(vaultData);
    logMsg(`   Master key: ${vault.masterKey ? 'found' : 'NOT FOUND'}`);
    logMsg(`   Salt: ${vault.salt || 'NOT FOUND'}`);

    logMsg('2. Fetching manifest...');
    const manifestRes = await fetch(`/api/fmp4/${videoId}/manifest`);
    const manifest = await manifestRes.json();
    logMsg(`   Format: ${manifest.format}`);
    logMsg(`   Wrapped key length: ${manifest.wrappedFileKey?.length}`);

    logMsg('3. Deriving master key...');
    const password = prompt('Enter vault password:');
    if (!password) {
      logMsg('   Cancelled');
      return;
    }
    
    // Derive key (simplified - same as vault)
    const salt = base64ToUint8Array(vault.salt);
    const keyMaterial = await crypto.subtle.importKey(
      'raw', 
      new TextEncoder().encode(password),
      'PBKDF2',
      false,
      ['deriveBits', 'deriveKey']
    );
    
    const masterKey = await crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: 600000,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      true,
      ['encrypt', 'decrypt']
    );
    logMsg('   Master key derived successfully');

    logMsg('4. Unwrapping file key...');
    const wrappedKeyData = base64ToUint8Array(manifest.wrappedFileKey);
    logMsg(`   Wrapped key data length: ${wrappedKeyData.length}`);
    logMsg(`   Key part (0-48): ${wrappedKeyData.slice(0, 48).length} bytes`);
    logMsg(`   IV part (48-60): ${wrappedKeyData.slice(48, 60).length} bytes`);
    
    try {
      const fileKeyRaw = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: wrappedKeyData.slice(48, 60) },
        masterKey,
        wrappedKeyData.slice(0, 48)
      );
      logMsg(`   File key unwrapped: ${fileKeyRaw.byteLength} bytes`);
      
      const fileKey = await crypto.subtle.importKey(
        'raw',
        fileKeyRaw,
        { name: 'AES-GCM', length: 256 },
        true,
        ['encrypt', 'decrypt']
      );
      logMsg('   File key imported successfully');

      logMsg('5. Fetching and decrypting first chunk...');
      const chunkRes = await fetch(`/api/stream/${videoId}/chunk/0`);
      const encryptedChunk = await chunkRes.arrayBuffer();
      logMsg(`   Encrypted chunk size: ${encryptedChunk.byteLength}`);
      
      const chunkIV = generateChunkIV(0);
      logMsg(`   Chunk IV: ${Array.from(chunkIV).join(',')}`);
      
      const decryptedChunk = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: chunkIV },
        fileKey,
        encryptedChunk
      );
      logMsg(`   Decrypted chunk size: ${decryptedChunk.byteLength}`);
      logMsg(`   First 16 bytes: ${Array.from(new Uint8Array(decryptedChunk.slice(0, 16))).join(',')}`);
      
      // Check for MP4 signature (ftyp)
      const firstBytes = new Uint8Array(decryptedChunk.slice(4, 8));
      const signature = String.fromCharCode(...firstBytes);
      logMsg(`   MP4 signature (bytes 4-8): "${signature}"`);
      
      if (signature === 'ftyp') {
        logMsg('   ✅ Valid MP4 detected!');
        
        // Create video blob
        const blob = new Blob([decryptedChunk], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        
        const video = document.createElement('video');
        video.controls = true;
        video.style.maxWidth = '100%';
        video.src = url;
        document.body.appendChild(video);
        
        video.onloadedmetadata = () => {
          logMsg(`   ✅ Video loaded: ${video.videoWidth}x${video.videoHeight}`);
        };
        
        video.onerror = () => {
          logMsg(`   ❌ Video error: ${video.error?.message}`);
        };
      } else {
        logMsg('   ❌ Not a valid MP4 file');
      }

    } catch (e) {
      logMsg(`   ❌ Decryption failed: ${e.message}`);
      logMsg(`   This usually means wrong password or corrupted data`);
    }

    status.textContent = 'Test complete';
  } catch (err) {
    logMsg(`ERROR: ${err.message}`);
    status.textContent = 'Test failed';
  }
}

testDecryption();
</script>
</body>
</html>
